name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.vscode/**'
      - 'src/*.yml'
      - 'src/*.yaml'
      - 'LICENSE'

  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.vscode/**'
      - 'src/*.yml'
      - 'src/*.yaml'
      - 'LICENSE'

jobs:
  tests-and-build:
    name: Tests and build verification
    runs-on: ubuntu-latest
    environment: tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B clean test

        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          SUPABASE_PROJECT_ID: test-project-ci
          SUPABASE_API_KEY: test-api-key-ci
          STORAGE_BUCKET: test-bucket-ci

      - name: Verify build
        run: mvn -B package -DskipTests